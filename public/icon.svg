<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Candle Flame Radial Glow -->
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="1" />
      <stop offset="35%" stop-color="#FDE047" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Ambient Golden Halo -->
    <radialGradient id="ambientHalo" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>

    <!-- Lotus Petal Gradients -->
    <linearGradient id="petalPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <linearGradient id="petalGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Leaf Base Gradient -->
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>

    <!-- Water Ripple Shadow -->
    <radialGradient id="waterRipple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Water Glow Below Krathong -->
  <ellipse cx="32" cy="54" rx="26" ry="6" fill="url(#waterRipple)" />

  <!-- Ambient Halo around Flame -->
  <circle cx="32" cy="22" r="18" fill="url(#ambientHalo)" />

  <!-- 1. Fresh Banana Leaf Base Layer -->
  <ellipse cx="32" cy="48" rx="24" ry="7" fill="url(#leafGreen)" stroke="#86EFAC" stroke-width="0.75" />
  <path d="M 10,48 Q 14,44 18,48 Q 22,43 26,48 Q 32,42 38,48 Q 42,43 46,48 Q 50,44 54,48" stroke="#BBF7D0" stroke-width="0.8" fill="none" opacity="0.8" />

  <!-- 2. Lotus Petals Ring (Outer & Inner) -->
  <path d="M 12,46 C 10,38 18,34 22,42 Z" fill="url(#petalPink)" opacity="0.9" />
  <path d="M 52,46 C 54,38 46,34 42,42 Z" fill="url(#petalPink)" opacity="0.9" />
  <path d="M 18,47 C 18,36 28,33 30,43 Z" fill="url(#petalPink)" />
  <path d="M 46,47 C 46,36 36,33 34,43 Z" fill="url(#petalPink)" />
  
  <path d="M 24,47 C 26,35 32,31 32,31 C 32,31 38,35 40,47 Z" fill="url(#petalPink)" stroke="#FECDD3" stroke-width="0.6" />
  <path d="M 27,47 C 28,38 32,35 32,35 C 32,35 36,38 37,47 Z" fill="url(#petalGold)" opacity="0.85" />

  <!-- Marigold / Gold Flower Trim -->
  <circle cx="22" cy="45" r="2.5" fill="#FBBF24" />
  <circle cx="28" cy="46" r="2.8" fill="#F59E0B" />
  <circle cx="36" cy="46" r="2.8" fill="#F59E0B" />
  <circle cx="42" cy="45" r="2.5" fill="#FBBF24" />

  <!-- 3. Incense Sticks (3 Sticks) -->
  <line x1="28" y1="36" x2="25" y2="17" stroke="#9A3412" stroke-width="0.9" stroke-linecap="round" />
  <line x1="32" y1="36" x2="32" y2="15" stroke="#78350F" stroke-width="0.9" stroke-linecap="round" />
  <line x1="36" y1="36" x2="39" y2="17" stroke="#9A3412" stroke-width="0.9" stroke-linecap="round" />
  <circle cx="25" cy="17" r="1.1" fill="#EF4444" />
  <circle cx="32" cy="15" r="1.1" fill="#EF4444" />
  <circle cx="39" cy="17" r="1.1" fill="#EF4444" />

  <!-- 4. Golden Candle -->
  <rect x="30.2" y="24" width="3.6" height="15" rx="1.2" fill="#FEF08A" stroke="#F59E0B" stroke-width="0.5" />
  <line x1="32" y1="24" x2="32" y2="21" stroke="#451A03" stroke-width="0.75" />

  <!-- 5. Flickering Candle Flame -->
  <path d="M 32,10 C 29,15 28.5,19 30,21.5 C 31,23 33,23 34,21.5 C 35.5,19 35,15 32,10 Z" fill="url(#flameGlow)" filter="drop-shadow(0 0 4px #F59E0B)" />
  <ellipse cx="32" cy="18" rx="1.6" ry="3.2" fill="#FFFFFF" opacity="0.95" />
  <circle cx="32" cy="18" r="1" fill="#FEF08A" />
</svg>